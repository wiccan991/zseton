<!DOCTYPE html>
<html lang="hu">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="DEALER">
<meta name="theme-color" content="#0b3d2e">
<title>DEALER</title>
<style>
  :root{
    --gold:#d4af37;
    --cream:#f3ead9;
    --spade:#173a28;
    --heart:#b5232f;
  }
  *{box-sizing:border-box; -webkit-tap-highlight-color:transparent;}
  html,body{
    margin:0; padding:0; height:100%;
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;
    color:var(--cream);
    overscroll-behavior:none;
  }

  .felt{
    position:relative;
    overflow:hidden;
    background: radial-gradient(120% 80% at 30% 12%,
                #1a6b47 0%, #0e4d31 55%, #073a24 100%);
  }
  .felt::before{
    content:""; position:absolute; inset:0; pointer-events:none;
    background: radial-gradient(140% 100% at 50% 50%,
                transparent 45%, rgba(0,0,0,.4) 100%);
  }
  .felt::after{
    content:""; position:absolute; inset:0; pointer-events:none; opacity:.06;
    background-image:
      repeating-linear-gradient(45deg,  #000 0 1px, transparent 1px 3px),
      repeating-linear-gradient(-45deg, #000 0 1px, transparent 1px 3px);
  }

  body{
    display:flex; flex-direction:column; align-items:center; justify-content:center;
    min-height:100vh; padding:calc(env(safe-area-inset-top) + 24px) 20px calc(env(safe-area-inset-bottom) + 24px);
  }
  h1{
    font-family:Georgia,"Times New Roman",serif;
    font-weight:700; letter-spacing:6px;
    font-size:32px; color:var(--cream);
    text-shadow:0 2px 0 rgba(0,0,0,0.4);
    margin:0 0 70px;
  }

  .card-table{
    display:flex; align-items:flex-end; justify-content:center;
  }

  .playing-card{
    width:150px; height:225px;
    background:linear-gradient(180deg,#fbf6ea,var(--cream));
    border-radius:16px;
    box-shadow:0 14px 30px rgba(0,0,0,0.5), inset 0 0 0 1px rgba(0,0,0,0.06);
    display:flex; flex-direction:column; align-items:center; justify-content:space-between;
    padding:14px 10px 20px;
    text-decoration:none;
    position:relative;
    transform-origin:bottom center;
    transition:transform 0.28s cubic-bezier(.22,.85,.35,1.25), box-shadow 0.28s ease;
  }
  .card-spade{ transform:rotate(-9deg) translateX(16px); margin-right:-8px; }
  .card-heart{ transform:rotate(9deg) translateX(-16px); margin-left:-8px; }

  .card-spade:hover{
    transform:rotate(-3deg) translateX(16px) translateY(-16px) scale(1.06);
    box-shadow:0 22px 40px rgba(0,0,0,0.55), inset 0 0 0 1px rgba(0,0,0,0.06);
    z-index:1;
  }
  .card-heart:hover{
    transform:rotate(3deg) translateX(-16px) translateY(-16px) scale(1.06);
    box-shadow:0 22px 40px rgba(0,0,0,0.55), inset 0 0 0 1px rgba(0,0,0,0.06);
    z-index:1;
  }

  .card-spade:active{ transform:rotate(-9deg) translateX(16px) scale(0.94); }
  .card-heart:active{ transform:rotate(9deg) translateX(-16px) scale(0.94); }

  .card-corner{
    align-self:flex-start;
    font-family:Georgia,serif; font-weight:700; font-size:19px; line-height:1;
  }
  .card-spade .card-corner{ color:var(--spade); }
  .card-heart .card-corner{ color:var(--heart); }
  .card-corner .suit{ display:block; font-size:16px; margin-top:2px; }

  .card-icon{ margin:6px 0; }

  .card-name{
    font-family:Georgia,"Times New Roman",serif;
    font-weight:700; font-size:16px; line-height:1.3;
    text-align:center;
  }
  .card-spade .card-name{ color:var(--spade); }
  .card-heart .card-name{ color:var(--heart); }

</style>
</head>
<body class="felt">

  <h1>DEALER</h1>

  <div class="card-table">
    <a class="playing-card card-spade" href="zsetonszamolo.html">
      <div class="card-corner">A<span class="suit">&#9824;</span></div>
      <svg class="card-icon" width="48" height="48" viewBox="0 0 46 46">
        <circle cx="23" cy="23" r="19" fill="none" stroke="#173a28" stroke-width="2.5"/>
        <circle cx="23" cy="23" r="12.5" fill="none" stroke="#173a28" stroke-width="2" stroke-dasharray="3 3.5"/>
        <circle cx="23" cy="23" r="5" fill="#173a28"/>
      </svg>
      <div class="card-name">Zseton<br>számláló</div>
    </a>
    <a class="playing-card card-heart" href="emlekezet_elterelas.html">
      <div class="card-corner">K<span class="suit">&#9829;</span></div>
      <svg class="card-icon" width="48" height="48" viewBox="0 0 46 46">
        <rect x="15" y="6" width="21" height="29" rx="4" fill="#fff" stroke="#b5232f" stroke-width="2" transform="rotate(13 25.5 20.5)"/>
        <rect x="8" y="8" width="21" height="29" rx="4" fill="#fff" stroke="#b5232f" stroke-width="2"/>
        <path d="M18.5 19.5c-1.8-2.8-6.6-1-5.6 2.7 0.9 3 5.6 5.8 5.6 5.8s4.7-2.8 5.6-5.8c1-3.7-3.8-5.5-5.6-2.7z" fill="#b5232f"/>
      </svg>
      <div class="card-name">Emlékezet<br>játék</div>
    </a>
  </div>


</body>
</html>
